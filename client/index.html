<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal-In-Web (CRT)</title>
    <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
    <style>
      html,body { height:100%; margin:0; background:#111; }
      .screen-wrapper {
        position:relative;
        width:100vw;
        height:100vh;
        margin:0;
        overflow:hidden;
      }
      .crt-image { display:block; width:100%; height:100%; object-fit:cover; }
      /* terminal container — fill the screen and use padding to keep it inside the CRT area */
      #terminal {
        position:absolute;
        left: 6%;
        top: 8%;
        width:88%;
        height:72%;
        pointer-events:auto;
        background: transparent;
      }
      /* username overlay */
      #userOverlay {
        position:absolute;
        left: 6%;
        top: 8%;
        width:88%;
        height:72%;
        display:flex;
        align-items:center;
        justify-content:center;
        pointer-events:auto;
      }
      .login-box {
        background: rgba(0,0,0,0.8);
        padding: 12px 16px;
        border-radius: 6px;
        color: #9f9;
        font-family: monospace;
      }
      .note { position: absolute; bottom: 8px; width: 100%; text-align:center; color:#9f9; font-family:monospace; }
    </style>
  </head>
  <body>
    <div class="screen-wrapper">
      <img class="crt-image" src="/assets/https___dev-to-uploads.s3.amazonaws.com_i_bpz8j2lyk39dmeb948ij.webp" alt="CRT screen" />
      <div id="terminal"></div>

      <div id="userOverlay" style="display:none">
        <div class="login-box">
          <div style="margin-bottom:8px">Enter a username for your workspace</div>
          <form id="userForm">
            <input id="usernameInput" name="username" placeholder="username" style="width:220px;padding:6px;background:#111;border:1px solid #2b2; color:#9f9;font-family:monospace" />
            <button type="submit" style="margin-left:8px;padding:6px 10px;background:#0a0;border:none;color:#030;font-weight:bold">Start</button>
          </form>
          <div id="userMsg" style="margin-top:8px;color:#f66;display:none"></div>
        </div>
      </div>

    </div>
    <div class="note">This session runs inside an isolated workspace folder; it will not use your project files.</div>

    <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
    <script>
      const term = new window.Terminal({ cols: 80, rows: 24, cursorBlink: true });
      term.open(document.getElementById('terminal'));

      const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${location.host}`);

      let authenticated = false;

      ws.onopen = () => { /* waiting for server request */ };

      ws.onmessage = async (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'request-username') {
            // show overlay and ask user
            document.getElementById('userOverlay').style.display = 'flex';
            const form = document.getElementById('userForm');
            const msgBox = document.getElementById('userMsg');
            form.addEventListener('submit', async (e) => {
              e.preventDefault();
              msgBox.style.display = 'none';
              const username = document.getElementById('usernameInput').value.trim();
              if (!username) { msgBox.textContent = 'Enter a username'; msgBox.style.display = 'block'; return; }
              // send username to server
              ws.send(JSON.stringify({ type: 'username', username }));
            });
            return;
          }

          if (msg.type === 'info') {
            // hide overlay when workspace created
            document.getElementById('userOverlay').style.display = 'none';
            authenticated = true;
            term.write(msg.message + '\r\n');
            return;
          }

          if (msg.type === 'output') {
            term.write(msg.data);
            return;
          }

          if (msg.type === 'error') {
            term.write('\r\nERROR: ' + msg.message + '\r\n');
            return;
          }
        } catch (e) {
          // not JSON — print raw
          term.write(ev.data);
        }
      };

      ws.onclose = () => term.write('\r\n*** disconnected ***');

      term.onData(data => {
        if (!authenticated) return; // ignore keystrokes until workspace is ready
        ws.send(data);
      });

      function sendResize() { const cols = term.cols; const rows = term.rows; ws.send(JSON.stringify({ type: 'resize', cols, rows })); }
      window.addEventListener('resize', () => { setTimeout(sendResize, 200); });
      setTimeout(sendResize, 200);
    </script>
  </body>
</html>
