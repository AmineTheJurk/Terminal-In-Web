<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal-In-Web (CRT)</title>
    <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
    <style>
      html,body { height:100%; margin:0; background:#2b2b2b; color:#9f9 }
      .screen-wrapper {
        position:relative;
        width:700px;
        margin:24px auto;
      }
      .crt-image { display:block; width:100%; height:auto; }
      /* terminal container — adjust left/top/width/height to align with the matrix area of your image */
      #terminal {
        position:absolute;
        left: 7.5%; /* tweak these values to fit your image */
        top: 6%;
        width:85%;
        height:78%;
        pointer-events:auto;
        background: transparent;
      }
      /* login overlay */
      .overlay {
        position: absolute;
        left: 7.5%;
        top: 6%;
        width: 85%;
        height: 78%;
        display:flex;
        align-items:center;
        justify-content:center;
        pointer-events:auto;
      }
      .login-box {
        background: rgba(0,0,0,0.8);
        padding: 16px;
        border-radius: 6px;
        color: #9f9;
        font-family: monospace;
      }
      .note { text-align:center; color:#9f9; font-family:monospace; margin-top:8px }
    </style>
  </head>
  <body>
    <div class="screen-wrapper">
      <img class="crt-image" src="/assets/https___dev-to-uploads.s3.amazonaws.com_i_bpz8j2lyk39dmeb948ij.webp" alt="CRT screen" />
      <div id="terminal"></div>
      <div id="overlay" class="overlay" style="display:none">
        <div class="login-box">
          <div style="margin-bottom:8px">Admin login</div>
          <form id="loginForm">
            <input id="tokenInput" name="token" placeholder="ADMIN token" style="width:260px;padding:6px;background:#111;border:1px solid #2b2; color:#9f9;font-family:monospace" />
            <button type="submit" style="margin-left:8px;padding:6px 10px;background:#0a0;border:none;color:#030;font-weight:bold">Login</button>
          </form>
          <div id="loginMsg" style="margin-top:8px;color:#f66;display:none"></div>
        </div>
      </div>
    </div>
    <div class="note">The app uses a session cookie for auth; enter your admin token if prompted.</div>

    <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
    <script>
      async function checkSession() {
        try {
          const res = await fetch('/session', { method: 'GET', credentials: 'include' });
          return res.ok;
        } catch (e) { return false; }
      }

      async function showLogin() {
        document.getElementById('overlay').style.display = 'flex';
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('loginMsg');
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          msg.style.display = 'none';
          const token = document.getElementById('tokenInput').value;
          try {
            const body = new URLSearchParams();
            body.append('token', token);
            const res = await fetch('/login', { method: 'POST', body: body, credentials: 'include', headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            if (res.ok) { window.location.reload(); return; }
            msg.textContent = 'Invalid token'; msg.style.display = 'block';
          } catch (e) { msg.textContent = 'Network error'; msg.style.display = 'block'; }
        });
      }

      async function initTerminal() {
        const term = new window.Terminal({ cols: 80, rows: 24, cursorBlink: true });
        term.open(document.getElementById('terminal'));

        const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
        const wsUrl = `${protocol}://${location.host}`; // no token in URL anymore
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => { term.write('Connected to server.\r\n'); };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'output') term.write(msg.data);
            if (msg.type === 'error') term.write('\r\nERROR: ' + msg.message + '\r\n');
          } catch (e) { term.write(ev.data); }
        };
        ws.onclose = () => term.write('\r\n*** disconnected ***');

        term.onData(data => { ws.send(data); });

        function sendResize() { const cols = term.cols; const rows = term.rows; ws.send(JSON.stringify({ type: 'resize', cols, rows })); }
        window.addEventListener('resize', () => { setTimeout(sendResize, 200); });
        setTimeout(sendResize, 200);
      }

      (async function() {
        const ok = await checkSession();
        if (!ok) { await showLogin(); return; }
        await initTerminal();
      })();
    </script>
  </body>
</html>
